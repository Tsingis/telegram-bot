name: pulumi
on:
  pull_request:
    branches:
      - main
    paths:
      - "pulumi/resources/**"
      - "pulumi/package*.json"
      - "pulumi/tsconfig.json"
      - ".github/workflows/pulumi.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: "Deployment stage"
        required: false
        default: "test"
        type: choice
        options:
          - common
          - test
          - prod
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.stage }}
  cancel-in-progress: true
jobs:
  pulumi:
    runs-on: "ubuntu-latest"
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: pulumi/package-lock.json
      - name: Install Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: ./pulumi
      - name: Run checks
        run: |
          npm run format
          npm run typecheck
        working-directory: ./pulumi
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE }}
      - name: Setup
        run: pulumi login ${{ env.PULUMI_BACKEND }}
        env:
          PULUMI_BACKEND: ${{ secrets.PULUMI_BACKEND }}
        working-directory: ./pulumi
      - name: Select stack ${{ github.event.inputs.stage || 'test' }}
        run: pulumi stack select ${{ env.STAGE }}
        env:
          STAGE: ${{ github.event.inputs.stage || 'test' }}
        working-directory: ./pulumi
      - name: Preview stack ${{ github.event.inputs.stage || 'test' }}
        run: pulumi refresh --preview-only
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        working-directory: ./pulumi
